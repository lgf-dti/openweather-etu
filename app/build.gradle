plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.safeargs)
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}


android {
    namespace 'com.example.mvvm_note'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.mvvm_note"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "OWM_API_KEY",
                "\"${localProps.getProperty('OWM_API_KEY', '')}\"")

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // Génère une classe de binding par layout (ex. fragment_note_list.xml -> FragmentNoteListBinding).
        viewBinding true
        buildConfig true
    }
}

dependencies {

    // UI
    implementation libs.core
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.fragment
    implementation libs.recyclerview

    // Architecture : ViewModel + LiveData
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    // Navigation Component
    implementation libs.navigation.fragment

    // Hilt : en Java, le compilateur Hilt passe par annotationProcessor
    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    // Tests unitaires (JVM)
    testImplementation libs.junit
    testImplementation libs.arch.core.testing   // InstantTaskExecutorRule pour tester LiveData

    // Tests instrumentés (appareil / émulateur)
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Retrofit + convertisseur JSON (Moshi)
    implementation libs.retrofit.core
    implementation libs.retrofit.moshi

    // OkHttp : le BOM aligne les versions ; logging-interceptor affiche
    // les requêtes dans le Logcat
    implementation platform(libs.okhttp.bom)
    implementation libs.okhttp.core
    implementation libs.okhttp.logging

}
